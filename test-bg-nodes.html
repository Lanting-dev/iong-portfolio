<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IONG | Node Background Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400&family=Inter:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #node-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── mock loading UI (placeholder for the real face-scan content) ── */
    .loading-ui {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      pointer-events: none;
      user-select: none;
    }

    .loading-ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-ring::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(42, 138, 122, 0.3);
    }

    .loading-ring-label {
      font-family: Orbitron, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
    }

    .loading-percent {
      font-family: Orbitron, sans-serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.7);
    }

    .loading-status {
      font-family: Inter, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(42, 138, 122, 0.6);
      text-transform: uppercase;
    }

    /* ── opacity slider for testing ── */
    .controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: Inter, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
    }

    .controls input[type="range"] {
      width: 160px;
      accent-color: #fff;
    }
  </style>
</head>
<body>

  <canvas id="node-canvas"></canvas>

  <div class="loading-ui">
    <div class="loading-ring">
      <span class="loading-ring-label">IONG</span>
    </div>
    <p class="loading-percent">64%</p>
    <p class="loading-status">Verifying identity</p>
  </div>

  <div class="controls">
    <span>Opacity</span>
    <input type="range" id="opacity-slider" min="2" max="100" value="90">
    <span id="opacity-value">90%</span>
  </div>

  <script>
    const canvas   = document.getElementById("node-canvas");
    const ctx      = canvas.getContext("2d");
    const slider   = document.getElementById("opacity-slider");
    const opLabel  = document.getElementById("opacity-value");
    const pctEl    = document.querySelector(".loading-percent");
    const statusEl = document.querySelector(".loading-status");

    const TAU = Math.PI * 2;
    const N   = 5;
    const LOAD_MS = 8000;

    let W, H, brightness = 0.90;
    let loadStart = null, progress = 0;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    slider.addEventListener("input", () => {
      brightness = slider.value / 100;
      opLabel.textContent = slider.value + "%";
    });

    function easeOut3(t) { return 1 - Math.pow(1 - t, 3); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    function pentTargets(r, offset = 0) {
      return Array.from({ length: N }, (_, i) => {
        const a = (i / N) * TAU - TAU / 4 + offset;
        return [Math.cos(a) * r, Math.sin(a) * r, 0];
      });
    }

    // each node has TWO sine components per axis → more complex Lissajous-like paths
    function makeNode(bx, by, amp) {
      return {
        bx, by,
        ax:  amp * (0.6 + Math.random() * 0.8),
        ax2: amp * (0.2 + Math.random() * 0.3),
        ay:  amp * (0.6 + Math.random() * 0.8),
        ay2: amp * (0.2 + Math.random() * 0.3),
        az:  amp * (0.5 + Math.random() * 0.7),
        fx:  TAU / (18000 + Math.random() * 16000),
        fx2: TAU / (7000  + Math.random() * 8000),
        fy:  TAU / (18000 + Math.random() * 16000),
        fy2: TAU / (7000  + Math.random() * 8000),
        fz:  TAU / (14000 + Math.random() * 12000),
        px:  Math.random() * TAU, px2: Math.random() * TAU,
        py:  Math.random() * TAU, py2: Math.random() * TAU,
        pz:  Math.random() * TAU,
        rotFreq:   0.000022 + Math.random() * 0.000020,
        rotPhase:  Math.random() * TAU,
      };
    }

    const spread = Math.min(window.innerWidth, window.innerHeight);
    const amp    = spread * 0.10;

    // main group – 5 nodes that converge to pentagon
    const mainNodes = Array.from({ length: N }, () =>
      makeNode((Math.random() - 0.5) * spread * 0.70,
               (Math.random() - 0.5) * spread * 0.55, amp));

    // ghost group – 5 extra nodes, dissolve before convergence
    const ghostNodes = Array.from({ length: N }, () =>
      makeNode((Math.random() - 0.5) * spread * 0.80,
               (Math.random() - 0.5) * spread * 0.60, amp * 1.1));

    const r1   = spread * 0.28;
    const mainTgts  = pentTargets(r1, 0);
    const ghostTgts = pentTargets(r1 * 0.55, TAU / 10);

    function node3D(node, target, t, p) {
      const cv    = easeOut3(Math.max(0, (p - 0.68) / 0.32));
      const drift = 1 - cv;
      return [
        lerp(node.bx, target[0], cv)
          + (Math.sin(t * node.fx  + node.px)  * node.ax
          +  Math.sin(t * node.fx2 + node.px2) * node.ax2) * drift,
        lerp(node.by, target[1], cv)
          + (Math.sin(t * node.fy  + node.py)  * node.ay
          +  Math.sin(t * node.fy2 + node.py2) * node.ay2) * drift,
        lerp(0, target[2], cv)
          + Math.sin(t * node.fz + node.pz) * node.az * drift,
      ];
    }

    function rotateXY(pts, rx, ry) {
      return pts
        .map(([x, y, z]) => [x, y*Math.cos(rx)-z*Math.sin(rx), y*Math.sin(rx)+z*Math.cos(rx)])
        .map(([x, y, z]) => [x*Math.cos(ry)+z*Math.sin(ry), y, -x*Math.sin(ry)+z*Math.cos(ry)]);
    }

    function project([x, y, z]) {
      const fov = 900, s = fov / (z + fov);
      return [x * s + W / 2, y * s + H / 2, s];
    }

    function drawNodes(nodes, targets, t, p, alpha) {
      if (alpha <= 0.01) return;

      const cv  = easeOut3(Math.max(0, (p - 0.68) / 0.32));
      const rot = 1 - cv;

      // per-node independent rotation adds to the chaos
      const pts = nodes.map((n, i) => {
        const rx = Math.sin(t * n.rotFreq * 0.7 + n.rotPhase) * 0.9 * rot;
        const ry = Math.sin(t * n.rotFreq       + n.rotPhase) * 1.4 * rot;
        return rotateXY([node3D(n, targets[i], t, p)], rx, ry).map(project)[0];
      });

      const b = brightness * alpha;

      // all-pairs connections, opacity ∝ 1/distance
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const [x1, y1, s1] = pts[i];
          const [x2, y2, s2] = pts[j];
          const dist = Math.hypot(x2 - x1, y2 - y1);
          const fade = Math.max(0, 1 - dist / (spread * 0.75));
          if (fade < 0.04) continue;
          const s = (s1 + s2) / 2;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.strokeStyle = `rgba(255,255,255,${(b * s * fade * 0.9).toFixed(3)})`;
          ctx.lineWidth   = s * fade * 0.65;
          ctx.stroke();
        }
      }

      // nodes
      pts.forEach(([x, y, s]) => {
        ctx.beginPath(); ctx.arc(x, y, 5.5 * s, 0, TAU);
        ctx.strokeStyle = `rgba(255,255,255,${(b * s * 0.75).toFixed(3)})`;
        ctx.lineWidth   = s * 0.55; ctx.stroke();

        ctx.beginPath(); ctx.arc(x, y, 2 * s, 0, TAU);
        ctx.fillStyle   = `rgba(255,255,255,${(b * s).toFixed(3)})`; ctx.fill();
      });
    }

    function draw(t) {
      if (loadStart === null) loadStart = t;
      progress = Math.min(1, (t - loadStart) / LOAD_MS);

      if (pctEl)    pctEl.textContent    = Math.round(progress * 100) + "%";
      if (statusEl) statusEl.textContent = progress < 1 ? "Verifying identity" : "Verified";

      // ── trail: fade rather than clear ──
      // trails get shorter as we approach 100% (cleaner pentagon at end)
      const fade = lerp(0.10, 0.28, easeOut3(progress));
      ctx.fillStyle = `rgba(0,0,0,${fade.toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);

      // ghost nodes dissolve by 70%
      const ghostAlpha = 1 - easeOut3(Math.max(0, (progress - 0.45) / 0.55));
      drawNodes(ghostNodes, ghostTgts, t, progress, ghostAlpha * 0.65);
      drawNodes(mainNodes,  mainTgts,  t, progress, 1.0);

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
